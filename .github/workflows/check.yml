name: Check marketplace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/catalog.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/catalog.py build
      - run: git diff --exit-code -- sources.json .agents .claude-plugin .zcode-plugin marketplaces packages
